name: Deploy Apps Script backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.github/workflows/deploy-apps-script.yml'
      - '.github/v46-deploy'

permissions:
  contents: write

jobs:
  deploy-apps-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare exact V46 source
        shell: bash
        run: |
          set -e
          git checkout bfd83d6580e978b95eb5ccbf82d748e405294b69 -- apps-script/Kod.js index.html
          git show 4c1cb3b234cde97bf40d8ddd1540d0d6421324b4:.github/workflows/performance-refactor.yml > /tmp/v46-builder.yml
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/v46-builder.yml').read_text(encoding='utf-8')
          start=text.index('      - name: Apply V46 source refactor')
          rs=text.index('        run: |',start)+len('        run: |')
          end=text.index('      - name: Validate source',rs)
          lines=text[rs:end].splitlines()
          script='\n'.join((x[10:] if x.startswith('          ') else x) for x in lines).strip('\n')+'\n'
          script=script.replace("if old not in code: raise SystemExit('cross prewarm source pattern not found')\ncode = code.replace(old, new, 1)", "if old in code: code = code.replace(old, new, 1)")
          Path('/tmp/apply-v46.sh').write_text(script,encoding='utf-8')
          PY
          bash /tmp/apply-v46.sh
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('apps-script/Kod.js'); s=p.read_text(encoding='utf-8')
          pat=r"var primary=\[\],secondary=\[\],secondaryType='',pf=Object\.assign\(\{},f,\{query:q\}\);.*?else\{primary=crossSearchRequestsV2_\(q,pf\);secondary=crossSearchVacanciesV2_\(q,pf\);secondaryType='vacancies';\}"
          rep="""var primary=[],secondary=[],secondaryType='',pf=Object.assign({},f,{query:q});
  if(mode==='candidates'){perfReadRowsBatch_(['Объявления соискателей','Бригады']);primary=crossSearchCandidatesV2_(q,pf);secondary=crossSearchBrigadesV2_(q,pf);secondaryType='brigades';}
  else if(mode==='brigades'){perfReadRowsBatch_(['Бригады','Объявления соискателей']);primary=crossSearchBrigadesV2_(q,pf);secondary=crossSearchCandidatesV2_(q,pf);secondaryType='candidates';}
  else if(mode==='vacancies'){perfReadRowsBatch_(['Вакансии','Ищу бригаду']);primary=crossSearchVacanciesV2_(q,pf);secondary=crossSearchRequestsV2_(q,pf);secondaryType='brigadeRequests';}
  else{perfReadRowsBatch_(['Ищу бригаду','Вакансии']);primary=crossSearchRequestsV2_(q,pf);secondary=crossSearchVacanciesV2_(q,pf);secondaryType='vacancies';}"""
          ns,n=re.subn(pat,rep,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('cross-search V46 patch failed')
          p.write_text(ns,encoding='utf-8')
          PY

      - name: Validate source
        shell: bash
        run: |
          set -e
          node --check apps-script/Kod.js
          node --check apps-script/Performance.js
          grep -q "V46_PERFORMANCE_ARCHITECTURE_2026-09-16" apps-script/Kod.js
          grep -q "V46 PERFORMANCE ARCHITECTURE" apps-script/Performance.js
          grep -q "scheduleSearchPrefetch_" index.html
          echo 'V46 source validation passed.'

      - name: Commit V46 source
        shell: bash
        run: |
          set -e
          git config user.name 'trifonov8888-bot'
          git.config user.email 'trifonov88.88@gmail.com' 2>/dev/null || true
          git config user.email 'trifonov88.88@gmail.com'
          git add apps-script/Kod.js apps-script/Performance.js index.html
          git diff --cached --quiet && { echo 'No V46 source changes'; exit 1; }
          git commit -m 'feat: V46 performance architecture'
          git push origin HEAD:main

      - name: Validate required secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          test -n "$CLASPRC_JSON" || { echo 'Missing CLASPRC_JSON'; exit 1; }
          test -n "$APPS_SCRIPT_ID" || { echo 'Missing APPS_SCRIPT_ID'; exit 1; }
          test -n "$DEPLOYMENT_ID" || { echo 'Missing APPS_SCRIPT_DEPLOYMENT_ID'; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Prepare clasp project
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s"}\n' "$APPS_SCRIPT_ID" > apps-script/.clasp.json

      - name: Push Apps Script V46
        working-directory: apps-script
        run: clasp push --force

      - name: Deploy V46
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        working-directory: apps-script
        run: |
          set -e
          clasp list-versions
          clasp update-deployment "$DEPLOYMENT_ID" --description "V46 Performance Architecture ${GITHUB_SHA::7}"
          echo 'V46_DEPLOY_SUCCESS'
