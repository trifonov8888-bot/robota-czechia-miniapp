name: Deploy Apps Script V46.1

on:
  push:
    paths:
      - '.github/v46-direct'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v461:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply robust V46.1 patch
        run: python3 scripts/apply-v461b.py
      - name: Validate source
        run: |
          set -e
          node --check apps-script/Kod.js
          node --check apps-script/Files.js
          grep -q 'V46_PERFORMANCE_ARCHITECTURE_2026-09-16' apps-script/Kod.js
          grep -q 'V46_1_CLIENT_CROSS_OVERRIDE' index.html
          echo 'V46.1 source validation passed.'
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html apps-script/Kod.js apps-script/Files.js
          if git diff --cached --quiet; then echo 'Source already contains V46.1'; else git commit -m 'fix: V46.1 search favorites premium navigation' && git push; fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1
      - name: Prepare clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          set -e
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s"}\n' "$APPS_SCRIPT_ID" > apps-script/.clasp.json
      - name: Push Apps Script
        working-directory: apps-script
        run: clasp push --force
      - name: Update existing Web App deployment
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        working-directory: apps-script
        run: |
          set -e
          clasp list-versions
          clasp update-deployment "$DEPLOYMENT_ID" --description "V46.1 Search/Favorites/Premium fix ${GITHUB_SHA::7}"
          echo 'V46_1_DEPLOY_SUCCESS'
