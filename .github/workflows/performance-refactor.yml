name: Apply V46 Performance Architecture

on:
  push:
    paths:
      - '.github/workflows/performance-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

# V46 execution note: this workflow is intentionally self-triggered by a workflow-file change.
