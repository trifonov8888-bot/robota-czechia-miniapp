name: V46 Build And Deploy

on:
  push:
    paths:
      - '.github/workflows/performance-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v46:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build V46 performance source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          code=Path('apps-script/Kod.js').read_text()
          index=Path('index.html').read_text()
          code=code.replace("const APP_VERSION = 'V44_UNIFIED_SEARCH_FAVORITES_SPEED_2026-09-16';","const APP_VERSION = 'V46_PERFORMANCE_ARCHITECTURE_2026-09-16';",1)
          old="""function searchSheet(sheetName,status,idHeader,filters,mapper){\n  var s=getSheet(sheetName);if(s.getLastRow()<2)return[];var h=getHeaders(s),v=s.getDataRange().getValues(),out=[];filters=filters||{};\n  v.slice(1).forEach(function(r){var o=rowObject(h,r);"""
          new="""function searchSheet(sheetName,status,idHeader,filters,mapper){\n  var rows=perfReadRows_(sheetName);if(!rows.length)return[];var out=[];filters=filters||{};\n  rows.forEach(function(o){"""
          if old in code: code=code.replace(old,new,1)
          old="""function crossSearchSheetV2_(sheetName,status,idHeader,query,filters,mapper,kind){filters=filters||{};query=String(query||'').trim();if(!query)return[];var rel=crossRelationProfile_(query),s=getSheet(sheetName);if(!s||s.getLastRow()<2)return[];var h=getHeaders(s),v=s.getDataRange().getValues(),out=[];v.slice(1).forEach(function(r){var o=rowObject(h,r);"""
          new="""function crossSearchSheetV2_(sheetName,status,idHeader,query,filters,mapper,kind){filters=filters||{};query=String(query||'').trim();if(!query)return[];var rel=crossRelationProfile_(query),rows=perfReadRows_(sheetName);if(!rows.length)return[];var out=[];rows.forEach(function(o){"""
          if old in code: code=code.replace(old,new,1)
          code=code.replace("key='CROSS_V45_'+","key='CROSS_V46_'+",1)
          Path('apps-script/Kod.js').write_text(code)
          Path('apps-script/Performance.js').write_text(r'''// V46 performance cache
var PERF_ROWS_CACHE_PREFIX_='PERF_ROWS_V46_';var PERF_ROWS_CACHE_TTL_=240;var PERF_ROWS_CHUNK_SIZE_=70000;
function perfRowsBase_(n){return PERF_ROWS_CACHE_PREFIX_+Utilities.base64EncodeWebSafe(String(n||''));}
function perfReadCachedRows_(n){var b=perfRowsBase_(n),c=CacheService.getScriptCache();try{var m=c.get(b+'_m');if(!m)return null;var x=JSON.parse(m),ks=[];for(var i=0;i<x.c;i++)ks.push(b+'_'+i);var p=c.getAll(ks),r='';for(var j=0;j<ks.length;j++){if(p[ks[j]]===undefined)return null;r+=p[ks[j]];}return JSON.parse(r);}catch(e){return null;}}
function perfWriteCachedRows_(n,rows){var b=perfRowsBase_(n),r=JSON.stringify(rows||[]),c=CacheService.getScriptCache(),v={},chunks=Math.max(1,Math.ceil(r.length/PERF_ROWS_CHUNK_SIZE_));for(var i=0;i<chunks;i++)v[b+'_'+i]=r.slice(i*PERF_ROWS_CHUNK_SIZE_,(i+1)*PERF_ROWS_CHUNK_SIZE_);v[b+'_m']=JSON.stringify({c:chunks,t:Date.now()});try{c.putAll(v,PERF_ROWS_CACHE_TTL_);}catch(e){}}
function perfReadRows_(n){var h=perfReadCachedRows_(n);if(h!==null)return h;var s=getSheet(n);if(!s||s.getLastRow()<2)return[];var hd=getHeaders(s),v=s.getDataRange().getValues(),o=[];for(var i=1;i<v.length;i++)o.push(rowObject(hd,v[i]));perfWriteCachedRows_(n,o);return o;}
function perfReadRowsBatch_(ns){var o={},m=[];(ns||[]).forEach(function(n){var h=perfReadCachedRows_(n);if(h===null)m.push(n);else o[n]=h;});if(!m.length)return o;try{if(typeof Sheets!=='undefined'&&Sheets.Spreadsheets&&Sheets.Spreadsheets.Values){var rs=m.map(function(n){return "'"+String(n).replace(/'/g,"''")+"'!A:ZZ";}),r=Sheets.Spreadsheets.Values.batchGet(SPREADSHEET_ID,{ranges:rs,valueRenderOption:'UNFORMATTED_VALUE'});(r.valueRanges||[]).forEach(function(x,i){var vals=x.values||[],hd=vals[0]||[],rows=[];for(var j=1;j<vals.length;j++){var z={};hd.forEach(function(k,q){if(k)z[k]=vals[j][q]===undefined?'':vals[j][q];});rows.push(z);}o[m[i]]=rows;perfWriteCachedRows_(m[i],rows);});return o;}}catch(e){console.warn('V46 batch fallback',e);}m.forEach(function(n){o[n]=perfReadRows_(n);});return o;}
''')
          # warm search cache while user types
          marker="function searchFilters(){const q=document.getElementById('smartSearchInput')?.value?.trim()||'';"
          if marker in index and 'function scheduleSearchPrefetch_' not in index:
            pos=index.find(marker)
            end=index.find('\n',pos)
            index=index[:end+1]+"var searchPrefetchTimer_=null;function scheduleSearchPrefetch_(){if(window.similarSearchMode)return;var q=String(document.getElementById('smartSearchInput')?.value||'').trim();if(q.length<2)return;clearTimeout(searchPrefetchTimer_);searchPrefetchTimer_=setTimeout(function(){var f=searchFilters(),k='robota_czechia_search_'+currentSearchMode+'_'+JSON.stringify(f);try{var x=localStorage.getItem(k);if(x&&Date.now()-Number(JSON.parse(x).ts||0)<900000)return;}catch(e){}apiPost({action:'searchCrossMatches',filters:Object.assign({},f,{mode:currentSearchMode})},15000,'background').then(function(r){if(r&&r.ok)try{localStorage.setItem(k,JSON.stringify({cross:r.results||{},ts:Date.now()}));}catch(e){}}).catch(function(){});},350);}\n"+index[end+1:]
          index=index.replace("populateSearchProfessions(e.target.value,document.getElementById('smartSearchInput')?.value||'');});const ssi", "populateSearchProfessions(e.target.value,document.getElementById('smartSearchInput')?.value||'');scheduleSearchPrefetch_();});const ssi",1)
          Path('index.html').write_text(index)
          PY

      - name: Validate
        run: |
          node --check apps-script/Kod.js
          node --check apps-script/Performance.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text();Path('/tmp/index.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/index.js

      - name: Commit V46 source
        run: |
          git config user.name 'trifonov8888-bot'
          git config user.email 'trifonov88.88@gmail.com'
          git add apps-script/Kod.js apps-script/Performance.js index.html
          git diff --cached --quiet && { echo 'No V46 changes'; exit 1; }
          git commit -m 'feat: V46 performance architecture'
          git push origin HEAD:main

      - name: Setup clasp
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Prepare clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s"}\n' "$APPS_SCRIPT_ID" > apps-script/.clasp.json

      - name: Push and deploy V46
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        working-directory: apps-script
        run: |
          set -e
          clasp push --force
          clasp update-deployment "$DEPLOYMENT_ID" --description "V46 Performance Architecture ${GITHUB_SHA::7}"
          echo 'V46_DEPLOY_SUCCESS'
