          new = """function crossSearchSheetV2_(sheetName,status,idHeader,query,filters,mapper,kind){filters=filters||{};query=String(query||'').trim();if(!query)return[];var rel=crossRelationProfile_(query),rows=perfReadRows_(sheetName);if(!rows.length)return[];var out=[];rows.forEach(function(o){"""
          if old not in code: raise SystemExit('cross sheet source pattern not found')
          code = code.replace(old, new, 1)

          old = """  var primary=[],secondary=[],secondaryType='',pf=Object.assign({},f,{query:q});
