              else{primary=crossSearchRequestsV2_(q,pf);secondary=crossSearchVacanciesV2_(q,pf);secondaryType='vacancies';}
          """
          new = """  var primary=[],secondary=[],secondaryType='',pf=Object.assign({},f,{query:q});
              // V46: both sides of a cross-search are warmed with one Sheets API batchGet.
              if(mode==='candidates'){
