name: Restore and Deploy V46

on:
  push:
    paths:
      - '.github/v46-now'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore backend and trigger direct deploy
        shell: bash
        run: |
          set -e
          git checkout bfd83d6580e978b95eb5ccbf82d748e405294b69 -- apps-script/Kod.js
          printf 'V46 direct trigger %s\n' "$(date -u +%FT%TZ)" > .github/v46-direct
          git config user.name 'trifonov8888-bot'
          git config user.email 'trifonov88.88@gmail.com'
          git add apps-script/Kod.js .github/v46-direct
          git diff --cached --quiet || git commit -m 'fix: restore backend and trigger V46 deploy'
          git push origin HEAD:main
