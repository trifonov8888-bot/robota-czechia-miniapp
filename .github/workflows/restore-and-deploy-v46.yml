name: Restore and Deploy V46

on:
  push:
    paths:
      - '.github/v46-now'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  restore-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore production backend source only
        shell: bash
        run: |
          set -e
          git checkout bfd83d6580e978b95eb5ccbf82d748e405294b69 -- apps-script/Kod.js
          git config user.name 'trifonov8888-bot'
          git config user.email 'trifonov88.88@gmail.com'
          git add apps-script/Kod.js
          git diff --cached --quiet || git commit -m 'fix: restore backend source before V46'
          git push origin HEAD:main

      - name: Dispatch direct V46 deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-v46-direct.yml --ref main
