name: Restore and Deploy V46

on:
  push:
    paths:
      - '.github/v46-now'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  restore-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good V44 backend and V46 builder
        shell: bash
        run: |
          set -e
          git checkout bfd83d6580e978b95eb5ccbf82d748e405294b69 -- apps-script/Kod.js
          git checkout bd78bc08c1fcb643a62c9f51d3f5de882ad9652e -- .github/workflows/performance-refactor.yml
          git config user.name 'trifonov8888-bot'
          git config user.email 'trifonov88.88@gmail.com'
          git add apps-script/Kod.js .github/workflows/performance-refactor.yml
          git diff --cached --quiet || git commit -m 'fix: restore V46 build sources'
          git push origin HEAD:main

      - name: Dispatch V46 builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run performance-refactor.yml --ref main
          echo 'V46 performance builder dispatched.'
