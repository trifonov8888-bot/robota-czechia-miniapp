name: Restore V46 refactor workflow

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good V46 refactor workflow
        shell: bash
        run: |
          set -e
          git show bd78bc08c1fcb643a62c9f51d3f5de882ad9652e:.github/workflows/performance-refactor.yml > .github/workflows/performance-refactor.yml
          git config user.name 'trifonov8888-bot'
          git config user.email 'trifonov88.88@gmail.com'
          git add .github/workflows/performance-refactor.yml
          git commit -m 'fix: restore V46 performance workflow'
          git push origin HEAD:main

      - name: Start restored V46 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run performance-refactor.yml --ref main
