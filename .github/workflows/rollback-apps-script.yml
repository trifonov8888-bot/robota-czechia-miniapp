name: Rollback Apps Script backend

on:
  workflow_dispatch:
    inputs:
      version_number:
        description: 'Apps Script version number to restore'
        required: true
        type: string
      reason:
        description: 'Rollback reason'
        required: false
        type: string

permissions:
  contents: read

jobs:
  rollback-apps-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          test -n "$CLASPRC_JSON" || { echo 'Missing GitHub Actions secret: CLASPRC_JSON'; exit 1; }
          test -n "$APPS_SCRIPT_ID" || { echo 'Missing GitHub Actions secret: APPS_SCRIPT_ID'; exit 1; }
          test -n "$DEPLOYMENT_ID" || { echo 'Missing GitHub Actions secret: APPS_SCRIPT_DEPLOYMENT_ID'; exit 1; }

      - name: Validate version number
        env:
          VERSION_NUMBER: ${{ inputs.version_number }}
        run: |
          case "$VERSION_NUMBER" in
            ''|*[!0-9]*) echo 'version_number must contain digits only'; exit 1 ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Prepare clasp project
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          cat > apps-script/.clasp.json <<EOF
          {
            "scriptId": "$APPS_SCRIPT_ID"
          }
          EOF

      - name: Roll back existing web-app deployment
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          VERSION_NUMBER: ${{ inputs.version_number }}
          REASON: ${{ inputs.reason }}
        working-directory: apps-script
        run: |
          DESCRIPTION="Rollback to Apps Script version ${VERSION_NUMBER}"
          if [ -n "$REASON" ]; then
            DESCRIPTION="$DESCRIPTION — $REASON"
          fi
          clasp update-deployment "$DEPLOYMENT_ID" --versionNumber "$VERSION_NUMBER" --description "$DESCRIPTION"
          echo "Rolled back deployment $DEPLOYMENT_ID to Apps Script version $VERSION_NUMBER"
