function normalizeProfessionTaxonomyText_(v){return String(v||'').toLowerCase().trim().replace(/ё/g,'е').replace(/[^a-zа-я0-9+.#-]+/gi,' ').replace(/\s+/g,' ');}
function applyEmbeddedProfessionTaxonomyFast_(){const map={},aliases={};EMBEDDED_TAXONOMY_ROWS.forEach(r=>{const category=String(r[1]||'').trim(),profession=String(r[3]||'').trim();if(!category||!profession)return;if(!map[category])map[category]=[];if(profession!=='Другой специалист'&&map[category].indexOf(profession)<0)map[category].push(profession);const terms=[profession].concat(String(r[4]||'').split(/[;,]/));terms.forEach(term=>{const key=normalizeProfessionTaxonomyText_(term);if(key){if(!aliases[key])aliases[key]=[];if(aliases[key].indexOf(profession)<0)aliases[key].push(profession);}});});Object.keys(map).forEach(c=>{map[c].sort((a,b)=>a.localeCompare(b,'ru'));map[c].push('Другой специалист');});professionMap=map;professionAliases=aliases;return true;}
async function loadProfessionTaxonomy(){
  function applyRows(rows){
    if(!Array.isArray(rows)||!rows.length)return false;
    const map={}; const aliases={};
    rows.forEach(row=>{
      const category=String(row.category||'').trim();
      const profession=String(row.canonical_profession||'').trim();
      if(!category||!profession)return;
      if(!map[category])map[category]=[];
      if(profession!=='Другой специалист'&&map[category].indexOf(profession)<0)map[category].push(profession);
      const terms=[profession].concat(String(row.aliases_for_search||'').split(/[;,]/));
      terms.forEach(term=>{
        const key=normalizeProfessionTaxonomyText_(term);
        if(!key)return;
        if(!aliases[key])aliases[key]=[];
        if(aliases[key].indexOf(profession)<0)aliases[key].push(profession);
      });
    });
    Object.keys(map).forEach(category=>{map[category].sort((a,b)=>a.localeCompare(b,'ru'));map[category].push('Другой специалист');});
    professionMap=map; professionAliases=aliases;
    return Object.keys(map).length>0;
  }
  const cacheKey='robota_czechia_profession_taxonomy_v3';
  try{
    const r=await apiPost({action:'getProfessionTaxonomy'},20000,'taxonomy');
    if(r&&r.ok&&Array.isArray(r.professions)&&applyRows(r.professions)){
      try{localStorage.setItem(cacheKey,JSON.stringify(r.professions));}catch(e){}
      return true;
    }
  }catch(e){}
  try{
    const cached=JSON.parse(localStorage.getItem(cacheKey)||'null');
    if(Array.isArray(cached)&&applyRows(cached))return true;
  }catch(e){}
  return applyRows(EMBEDDED_TAXONOMY_ROWS.map(r=>({category_id:r[0],category:r[1],profession_id:r[2],canonical_profession:r[3],aliases_for_search:r[4],priority:r[5],image_filename:r[6]})));
}
function allProfessions(){const out=[];Object.keys(professionMap).forEach(c=>professionMap[c].forEach(p=>{if(p!=='Другой специалист'&&out.indexOf(p)<0)out.push(p)}));return out;}
function normalizeQuery(v){return String(v||'').toLowerCase().replace(/ё/g,'е').replace(/і/g,'i').replace(/ї/g,'i').replace(/є/g,'e').replace(/ґ/g,'g').replace(/[áä]/g,'a').replace(/č/g,'c').replace(/ď/g,'d').replace(/[éě]/g,'e').replace(/í/g,'i').replace(/ň/g,'n').replace(/[óö]/g,'o').replace(/ř/g,'r').replace(/š/g,'s').replace(/[ť]/g,'t').replace(/[úůü]/g,'u').replace(/ý/g,'y').replace(/ž/g,'z').replace(/[^a-zа-я0-9+]+/g,' ').trim();}
function professionCategoryFor_(profession){for(const c of Object.keys(professionMap)){if((professionMap[c]||[]).some(p=>p===profession))return c;}return 'Другое';}
function smartProfessionMatches(query,category){
  const q=normalizeQuery(query);const pool=category&&professionMap[category]?professionMap[category]:allProfessions();
  if(!q)return pool.filter(x=>x!=='Другой специалист').slice(0,12).map(x=>({x,category:professionCategoryFor_(x),score:1}));
  const tokens=q.split(/\s+/).filter(Boolean),forced={};
  try{
    Object.keys(SMART_PROFESSION_ALIASES||{}).forEach(k=>{
      const nk=normalizeQuery(k);if(!nk)return;
      if(nk===q||nk.startsWith(q)||q.startsWith(nk)||tokens.some(t=>nk===t||nk.startsWith(t))){
        (SMART_PROFESSION_ALIASES[k]||[]).forEach((v,i)=>{const nv=normalizeQuery(v);if(nv)forced[nv]=Math.max(forced[nv]||0,430-i*8);});
      }
    });
  }catch(e){}
  try{
    Object.keys(UNIVERSAL_TITLE_RELATIONS||{}).forEach(k=>{
      const nk=normalizeQuery(k);if(!nk)return;
      if(nk===q||nk.startsWith(q)||q.startsWith(nk)||tokens.some(t=>nk===t||nk.startsWith(t))){
        (UNIVERSAL_TITLE_RELATIONS[k]||[]).forEach((v,i)=>{const nv=normalizeQuery(v);if(nv)forced[nv]=Math.max(forced[nv]||0,510-i*10);});
      }
    });
  }catch(e){}
  const out=pool.filter(x=>x!=='Другой специалист').map(x=>{
    const n=normalizeQuery(x),nt=n.split(/\s+/).filter(Boolean);let score=forced[n]||0;
    if(n===q)score=Math.max(score,900);if(n.startsWith(q))score=Math.max(score,650);if(n.indexOf(q)>=0)score=Math.max(score,520);
    tokens.forEach(t=>nt.forEach(w=>{if(w===t)score=Math.max(score,620);else if(w.startsWith(t))score=Math.max(score,570);else if(w.indexOf(t)>=0)score=Math.max(score,500);}));
    try{Object.keys(professionAliases||{}).forEach(k=>{if((k===q||k.startsWith(q)||q.startsWith(k))&&(professionAliases[k]||[]).indexOf(x)>=0)score=Math.max(score,460);});}catch(e){}
    return{x,category:professionCategoryFor_(x),score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.x.localeCompare(b.x,'ru')).slice(0,12);
  return out;
}
function smartProfessionSuggestions(query,category){return smartProfessionMatches(query,category).map(x=>x.x);}

function resetFreshPublishForm_(root){
  if(!root)return;
  root.querySelectorAll('input,select,textarea').forEach(function(el){
    if(el.type==='checkbox'||el.type==='radio')el.checked=false;
    else if(el.type==='file')el.value='';

    el.autocomplete='off';
  });

let currentType='Предлагаю работу'; let activeSubmissionId=''; let myProfilesPromise=null; window.myProfilesCache=null; window.currentCandidateProfile=null;
function normalizeClientCandidateProfile_(p){
  if(!p)return null;
  const q={
    profile_id:p.profile_id||p['profile_id']||'',
    user_id:p.user_id||p['user_id']||'',
    name:p.name||p['Имя']||'',
    education:p.education||p['Образование']||'',
    professionalSkills:p.professionalSkills||p['Профессии и навыки']||'',
    languages:p.languages||p['Языки']||'',
    languageLevel:p.languageLevel||p['Уровень языка']||'',
    documents:p.documents||p['Документы']||'',
    drivingLicenses:p.drivingLicenses||p['Водительские права']||'',
    licenseCategories:p.licenseCategories||p['Категории прав']||'',
    automobile:p.automobile||p['Автомобиль']||'',
    photo:p.photo||p['Фото']||'',
    resume:p.resume||p['Файл резюме']||'',
    contact:p.contact||p['Контакт']||'',
    telegram:p.telegram||p['Telegram']||'',
    contactAvailable:p.contactAvailable!==undefined?p.contactAvailable:true
  };
  return (q.name||q.user_id||q.profile_id||q.languages||q.contact||q.photo||q.resume)?q:null;
}
function getCachedCandidateProfile_(){
  const uid=String(tg?.initDataUnsafe?.user?.id||'');
  if(window.currentCandidateProfile){
    const p=normalizeClientCandidateProfile_(window.currentCandidateProfile);
    if(p){window.currentCandidateProfile=p;return p;}
  }
  if(!uid)return null;
  try{
    const raw=localStorage.getItem('robota_czechia_my_candidate_profile_'+uid);
    if(raw){
      const p=normalizeClientCandidateProfile_(JSON.parse(raw));
      if(p){
        window.currentCandidateProfile=p;
        try{localStorage.setItem('robota_czechia_my_candidate_profile_'+uid,JSON.stringify(p));}catch(e){}
        return p;
      }
    }
  }catch(e){}
  if(window.myProfilesCache&&Array.isArray(window.myProfilesCache.candidates)&&window.myProfilesCache.candidates[0]){
    const p=normalizeClientCandidateProfile_(window.myProfilesCache.candidates[0]);
    if(p){window.currentCandidateProfile=p;return p;}
  }
  return null;
}
let candidatePrefillPromise=null;
function prefetchMyProfiles(){
  const uid=String(clientUser().id||''); if(!uid)return null;
  const cached=getCachedCandidateProfile_();
  if(cached)return Promise.resolve({ok:true,profile:cached,candidates:[cached],prefill:true});
  if(candidatePrefillPromise)return candidatePrefillPromise;
  candidatePrefillPromise=apiPost({action:'getCandidatePrefill',userId:uid,firstName:tg?.initDataUnsafe?.user?.first_name||'',lastName:tg?.initDataUnsafe?.user?.last_name||'',telegramUsername:tg?.initDataUnsafe?.user?.username||''},45000,'profile').then(r=>{
    if(r&&r.ok&&r.profile){
      const p=normalizeClientCandidateProfile_(r.profile);
      if(p){
        window.currentCandidateProfile=p;
        window.myProfilesCache=Object.assign({},window.myProfilesCache||{},{candidates:[p]});
        try{localStorage.setItem('robota_czechia_my_candidate_profile_'+uid,JSON.stringify(p));}catch(e){
          try{sessionStorage.setItem('robota_czechia_my_candidate_profile_'+uid,JSON.stringify(p));}catch(ignore){}
        }
        r.profile=p;
      }
    }
    return r;
  }).catch(e=>{candidatePrefillPromise=null;throw e;});
  return candidatePrefillPromise;
}

  const ph=root.querySelector('#photoFileHint');if(ph&&p.photo)ph.innerHTML='📷 Фото прикреплено в постоянном профиле — будет использовано автоматически. <span class="hint">Выберите новый файл, чтобы заменить его.</span>';

  updateLivePreview('Ищу работу');return true;
}

function bindTitleSmart(type){
  const input=document.getElementById('title'),box=document.getElementById('titleSuggestions'),cat=document.getElementById('category');
  if(!input||!box)return;

  const applySuggestion=(p,c)=>{
    if(type==='Бригада ищет работу'||type==='Ищу бригаду'){
      let canonical=p; const nq=normalizeQuery(p); const hit=(BRIGADE_TAXONOMY_V2.specializations||[]).find(x=>normalizeQuery(x)===nq||normalizeQuery(x).indexOf(nq)>=0||nq.indexOf(normalizeQuery(x))>=0); if(hit)canonical=hit;
      input.value=canonical;
      if(cat&&c){let opt=[...cat.options].find(o=>o.value===c||o.textContent.trim()===c);if(!opt){opt=document.createElement('option');opt.value=c;opt.textContent=c;cat.appendChild(opt);}cat.value=c;cat.dispatchEvent(new Event('change'));}
      setTimeout(()=>{document.querySelectorAll('input[name="specialization"]').forEach(cb=>{if(normalizeQuery(cb.value)===normalizeQuery(canonical))cb.checked=true;});updateMultiSummary('specialization','Выберите');updateLivePreview(type);},0);
      box.classList.add('hidden');box.innerHTML='';return;
    }
    input.value=p;
    if(cat&&c){
      let opt=[...cat.options].find(o=>o.value===c||o.textContent.trim()===c);
      if(!opt){opt=document.createElement('option');opt.value=c;opt.textContent=c;cat.appendChild(opt);}
      cat.value=c;cat.dispatchEvent(new Event('change'));
    }
    setTimeout(()=>{
      populateProfessions(c,p);
      const cb=[...document.querySelectorAll('input[name=profession]')].find(x=>x.value===p);
      if(cb){cb.checked=true;updateMultiSummary('profession','Выберите профессию');}
      updateLivePreview(type);
    },0);
    box.classList.add('hidden');
    box.innerHTML='';
  };

  const run=()=>{
    const q=input.value.trim();
    if(!q){box.classList.add('hidden');box.innerHTML='';return;}

    // Для бригад сначала ищем по канонической универсальной таксономии специализаций.
    let matches=[];
    if(type==='Бригада ищет работу'||type==='Ищу бригаду'){
      const nq=normalizeQuery(q);
      matches=(BRIGADE_TAXONOMY_V2.specializations||[]).map(x=>{const n=normalizeQuery(x),a=(BRIGADE_TAXONOMY_V2.aliases[x]||[]).map(normalizeQuery);const score=n===nq?1200:(a.indexOf(nq)>=0?1100:(n.indexOf(nq)>=0||nq.indexOf(n)>=0?900:0));return {x:x,category:'Строительство и ремонт',score:score};}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
    }
    if(!matches.length){
      // Ищем по общей профессиональной таксономии.
      matches=smartProfessionMatches(q,'');
    }
    // Точное название всегда должно находиться даже при проблемах с alias-индексом.
    if(!matches.length){
      const nq=normalizeQuery(q);
      const all=allProfessions().filter(x=>x!=='Другой специалист');

  while(token.length%4)token+='=';

}

async function runSearch(timeoutMs=12000){
  const action=currentSearchMode==='vacancies'?'searchVacancies':currentSearchMode==='candidates'?'searchCandidates':currentSearchMode==='brigadeRequests'?'searchBrigadeRequests':'searchBrigades';
  const filters=searchFilters(),cacheKey='robota_czechia_search_'+currentSearchMode+'_'+JSON.stringify(filters),box=document.getElementById('results');
  var hasLocal=false;
  try{var raw=localStorage.getItem(cacheKey);if(raw){var local=JSON.parse(raw);if(local&&local.cross){renderCrossResults(local.cross);hasLocal=true;}else if(local&&Array.isArray(local.results)){renderResults(currentSearchMode,local.results);hasLocal=true;}}}catch(e){}
  if(box.innerHTML.trim()==='' && !hasLocal)box.innerHTML='<p class="muted">🔎 Ищем подходящие варианты...</p>';
  // When local results exist, the UI is already usable. Refresh in the background
  // instead of making the user wait for Google Sheets on every search.
  if(hasLocal){
    setTimeout(function(){runSearchFresh_(filters,cacheKey,box,action,timeoutMs);},0);
    return;
  }
  try{
    if(!window.similarSearchMode){
      let r=await apiPost({action:'searchCrossMatches',filters:Object.assign({},filters,{mode:currentSearchMode})},timeoutMs,'general');
      if(!r.ok)throw new Error(r.error||'Ошибка поиска');
      try{localStorage.setItem(cacheKey,JSON.stringify({cross:r.results||{primary:[],secondary:[],secondaryType:''},ts:Date.now()}));}catch(e){}
      renderCrossResults(r.results||{});
    }else{
      let r=await apiPost({action,filters:filters},timeoutMs,'general');if(!r.ok)throw new Error(r.error||'Ошибка поиска');
      try{localStorage.setItem(cacheKey,JSON.stringify({results:r.results||[],ts:Date.now()}));}catch(e){}
      renderResults(currentSearchMode,r.results||[]);
    }
  }catch(e){if(box.innerHTML.indexOf('result-card')<0)box.innerHTML='<p class="error">❌ '+esc(e.message)+'</p>';}
}
async function runSearchFresh_(filters,cacheKey,box,action,timeoutMs){
  try{
    if(!window.similarSearchMode){
      let r=await apiPost({action:'searchCrossMatches',filters:Object.assign({},filters,{mode:currentSearchMode})},timeoutMs,'general');
      if(!r.ok)throw new Error(r.error||'Ошибка поиска');
      try{localStorage.setItem(cacheKey,JSON.stringify({cross:r.results||{primary:[],secondary:[],secondaryType:''},ts:Date.now()}));}catch(e){}
      if(box&&document.getElementById('results')===box)renderCrossResults(r.results||{});
    }else{
      let r=await apiPost({action:action,filters:filters},timeoutMs,'general');if(!r.ok)throw new Error(r.error||'Ошибка поиска');
      try{localStorage.setItem(cacheKey,JSON.stringify({results:r.results||[],ts:Date.now()}));}catch(e){}
      if(box&&document.getElementById('results')===box)renderResults(currentSearchMode,r.results||[]);
    }
  }catch(e){ /* cached results remain visible */ }
}

async function openDetail(type,id,preloaded){
  if(!window.lastDetailContext)window.lastDetailContext=(document.getElementById('searchPanel').classList.contains('hidden')?'profile':'search');
  document.getElementById('publishPanel').classList.add('hidden');document.getElementById('searchPanel').classList.add('hidden');document.getElementById('profilePanel').classList.add('hidden');document.getElementById('editPanel').classList.add('hidden');document.getElementById('detailPanel').classList.remove('hidden');
  let box=document.getElementById('detailContent'),decodedId=decodeURIComponent(id),browserCached=preloaded||null;
  if(!browserCached&&window.searchResultCache){var ck=type==='vacancy'?'vacancies':type==='brigade'?'brigades':type==='request'?'brigadeRequests':'candidates';browserCached=window.searchResultCache[ck]?.[String(decodedId)]||null;}
  if(!browserCached&&window.myProfilesCache){
    const list=type==='vacancy'?window.myProfilesCache.vacancies:type==='brigade'?window.myProfilesCache.brigades:type==='request'?window.myProfilesCache.brigadeRequests:[];
    if(Array.isArray(list)){const idKey=type==='vacancy'?'ID':type==='brigade'?'brigade_id':'brigade_request_id';browserCached=list.find(x=>String(x[idKey]||'')===String(decodedId))||null;}
  }
  if(browserCached)box.innerHTML=detailHtml(type,browserCached)+(type==='brigade'?(brigadePremiumActionHtml_(decodedId)+favoriteButtonHtml_(type,decodedId,isFavorite_(type,decodedId))):type==='request'?favoriteButtonHtml_(type,decodedId,isFavorite_(type,decodedId)):'');
  else box.innerHTML='<p class="muted">Открываем...</p>';
  // Never make the user wait for a second server round-trip when search already
  // returned the complete announcement. Refresh in the background only.
  let action=type==='candidate'?'getCandidateProfile':type==='vacancy'?'getVacancy':type==='brigade'?'getBrigade':'getBrigadeRequest';
  let key=type==='candidate'?'profileId':type==='vacancy'?'vacancyId':type==='brigade'?'brigadeId':'brigadeRequestId';
  apiPost({action,[key]:decodedId},15000,type==='candidate'?'profile':'general').then(function(r){
    if(!r||!r.ok)return;
    let o=r.profile||r.vacancy||r.brigade||r.request;
    if(type==='candidate')cacheProfileInBrowser(decodedId,o);
    // If there was already a cached result, keep the instant render and silently
    // refresh it only when the returned object is actually usable.
    if(o)box.innerHTML=detailHtml(type,o)+(type==='brigade'?(brigadePremiumActionHtml_(decodedId)+favoriteButtonHtml_(type,decodedId,isFavorite_(type,decodedId))):type==='request'?favoriteButtonHtml_(type,decodedId,isFavorite_(type,decodedId)):'');
  }).catch(function(e){
    if(!browserCached)box.innerHTML='<p class="error">❌ '+esc(e.message)+'</p>';
  });
}
