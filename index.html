function allProfessions(){const out=[];Object.keys(professionMap).forEach(c=>professionMap[c].forEach(p=>{if(p!=='Другой специалист'&&out.indexOf(p)<0)out.push(p)}));return out;}
function normalizeQuery(v){return String(v||'').toLowerCase().replace(/ё/g,'е').replace(/і/g,'i').replace(/ї/g,'i').replace(/є/g,'e').replace(/ґ/g,'g').replace(/[áä]/g,'a').replace(/č/g,'c').replace(/ď/g,'d').replace(/[éě]/g,'e').replace(/í/g,'i').replace(/ň/g,'n').replace(/[óö]/g,'o').replace(/ř/g,'r').replace(/š/g,'s').replace(/[ť]/g,'t').replace(/[úůü]/g,'u').replace(/ý/g,'y').replace(/ž/g,'z').replace(/[^a-zа-я0-9+]+/g,' ').trim();}
function professionCategoryFor_(profession){for(const c of Object.keys(professionMap)){if((professionMap[c]||[]).some(p=>p===profession))return c;}return 'Другое';}
function smartProfessionMatches(query,category){const q=normalizeQuery(query);const pool=category&&professionMap[category]?professionMap[category]:allProfessions();if(!q)return pool.filter(x=>x!=='Другой специалист').slice(0,12).map(x=>({x,category:professionCategoryFor_(x),score:1}));const tokens=q.split(/\s+/).filter(Boolean),aliasHits=[];Object.keys(professionAliases).forEach(k=>{if(k.indexOf(q)>=0||q.indexOf(k)>=0||tokens.some(t=>k.indexOf(t)>=0||t.indexOf(k)>=0))(professionAliases[k]||[]).forEach(x=>{if(aliasHits.indexOf(x)<0)aliasHits.push(x);});});return pool.filter(x=>x!=='Другой специалист').map(x=>{const n=normalizeQuery(x);let score=0;if(n===q)score+=140;if(n.startsWith(q))score+=110;else if(n.indexOf(q)>=0||q.indexOf(n)>=0)score+=75;tokens.forEach(t=>{if(n.startsWith(t))score+=45;else if(n.indexOf(t)>=0)score+=25;});aliasHits.forEach(a=>{const an=normalizeQuery(a);if(n===an)score+=100;else if(n.indexOf(an)>=0)score+=45;});return{x,category:professionCategoryFor_(x),score};}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.x.localeCompare(b.x,'ru')).slice(0,12);}
function smartProfessionSuggestions(query,category){return smartProfessionMatches(query,category).map(x=>x.x);}

    if(el.type==='checkbox'||el.type==='radio')el.checked=false;
    else if(el.type==='file')el.value='';
    else el.value='';
    el.autocomplete='off';
  });
  root.querySelectorAll('input[type=checkbox]').forEach(function(el){el.checked=false;});

}

    Object.keys(map).forEach(category=>{map[category].sort((a,b)=>a.localeCompare(b,'ru'));if(map[category].indexOf('Другой специалист')<0)map[category].push('Другой специалист');});
    professionMap=map; professionAliases=aliases;
    return Object.keys(map).length>0;
  }
  try{
    const r=await apiPost({action:'getProfessionTaxonomy'},20000,'taxonomy');
    if(r&&r.ok&&Array.isArray(r.professions)&&applyRows(r.professions)){
      try{localStorage.setItem(cacheKey,JSON.stringify({savedAt:Date.now(),professions:r.professions}));}catch(e){}
      return true;
    }
  }catch(e){}
  try{const cached=JSON.parse(localStorage.getItem(cacheKey)||'null');if(cached&&Array.isArray(cached.professions)&&applyRows(cached.professions))return true;}catch(e){}
  return false;
}

async function openDetail(type,id){
  if(!window.lastDetailContext)window.lastDetailContext=(document.getElementById('searchPanel').classList.contains('hidden')?'profile':'search');

  let box=document.getElementById('detailContent');box.innerHTML='<p class="muted">Загрузка...</p>';
  let decodedId=decodeURIComponent(id),browserCached=null;
  if(type==='candidate') browserCached=getCachedProfileFromBrowser(decodedId);
  else if(window.myProfilesCache){
    const list=type==='vacancy'?window.myProfilesCache.vacancies:type==='brigade'?window.myProfilesCache.brigades:type==='request'?window.myProfilesCache.brigadeRequests:[];
    if(Array.isArray(list)){

      browserCached=list.find(x=>String(x[idKey]||'')===String(decodedId))||null;
    }
  }

  let action=type==='candidate'?'getCandidateProfile':type==='vacancy'?'getVacancy':type==='brigade'?'getBrigade':'getBrigadeRequest';
  let key=type==='candidate'?'profileId':type==='vacancy'?'vacancyId':type==='brigade'?'brigadeId':'brigadeRequestId';
  try{
    let r=await apiPost({action,[key]:decodedId},type==='candidate'?25000:45000,type==='candidate'?'profile':'general');

  }catch(e){if(!browserCached)box.innerHTML='<p class="error">❌ '+esc(e.message)+'</p>';}
}
