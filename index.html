<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Работа в Чехии</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#0e1117;--card:#171b23;--line:#2a303b;--text:#f3f5f7;--muted:#9ca6b5;--accent:#2ea6ff;--danger:#ff5d6c;--ok:#39d98a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:14px 12px 40px}main{max-width:760px;margin:auto}.top{text-align:center;margin:4px 0 14px}.top h1{font-size:22px;margin:0 0 4px}.top p{margin:0;color:var(--muted)}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.nav button,.mode button,.button,.result-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:12px 10px;font-weight:700;cursor:pointer}.nav button.active,.mode button.active,.button{background:var(--accent);border-color:var(--accent);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}.hidden{display:none!important}.section-title{font-size:18px;font-weight:800;margin-bottom:12px}.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.mode button{min-height:58px}.field{margin-bottom:12px}.field label{display:block;font-weight:700;margin:0 0 6px}.required{color:var(--danger)}input,select,textarea{width:100%;border:1px solid var(--line);background:#10141b;color:var(--text);border-radius:11px;padding:12px;font:inherit;outline:none}textarea{min-height:110px;resize:vertical}select{appearance:auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px}.check input{width:auto}.hint{color:var(--muted);font-size:13px}.button{width:100%;font-size:16px;margin-top:4px}.file{padding:10px}.preview{margin-top:8px;max-height:180px;max-width:100%;border-radius:12px;display:block}.tags{display:flex;flex-wrap:wrap;gap:6px}.multi{border:1px solid var(--line);border-radius:11px;background:#10141b;padding:0}.multi summary{cursor:pointer;padding:12px;list-style:none}.multi summary::-webkit-details-marker{display:none}.multi[open] summary{border-bottom:1px solid var(--line)}.multi .checkgrid{padding:10px}.tag{background:#202735;border-radius:999px;padding:5px 9px;font-size:13px}.result-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0}.result-title{font-size:17px;font-weight:800;margin-bottom:7px}.line{margin:4px 0}.muted{color:var(--muted)}.result-btn{width:100%;margin-top:10px;background:#202735}.profile-photo{width:120px;height:120px;object-fit:cover;border-radius:14px;margin:0 auto 12px;display:block;cursor:zoom-in}.profile-photo:active{transform:scale(.98)}#readyDate{cursor:pointer}.date-wrap{display:flex;gap:8px}.date-wrap input{flex:1}.date-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:0 15px;font-size:18px;cursor:pointer}.live-preview{background:#10141b;border:1px solid var(--line);border-radius:14px;padding:13px;margin:14px 0}.live-preview .preview-title{font-size:17px;font-weight:800;margin-bottom:8px}.preview-main{font-size:21px;font-weight:900;background:#b91c1c;color:#fff;border-radius:10px;padding:10px 12px;margin:0 0 10px}.live-preview .preview-line{margin:4px 0}.preview-empty{color:var(--muted);font-size:13px}.success{color:var(--ok);font-weight:800}.error{color:var(--danger);font-weight:700}.actions{display:flex;gap:8px}.actions>*{flex:1}.small{font-size:12px}.divider{height:1px;background:var(--line);margin:14px 0}.profile-card{background:#121722;border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0}.profile-card .profile-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}.profile-icon{font-size:26px}.profile-name{font-size:17px;font-weight:800}.subcard{background:#171b23;border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:8px}.subcard-title{font-weight:800}.profile-actions,.announcement-actions{display:flex;gap:7px;margin-top:9px}.profile-actions button,.announcement-actions button{flex:1}.secondary{background:#202735!important;border-color:#343d4c!important;color:var(--text)!important}.tiny{font-size:12px}@media(max-width:520px){.row,.row3{grid-template-columns:1fr}.checkgrid{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}.mode{grid-template-columns:1fr 1fr}}
</style></head><body><main>
<div class="top"><h1>🇨🇿 Работа в Чехии</h1><p>Вакансии, соискатели и бригады</p></div>
<div class="nav"><button data-nav="publish" class="active">📢 Разместить</button><button data-nav="jobs">🔎 Найти работу</button><button data-nav="workers">👤 Найти работника</button><button data-nav="profile">👤 Мой профиль</button></div>

<section id="publishPanel" class="card"><div class="section-title">📢 Что вы хотите разместить?</div><div class="mode"><button data-type="Предлагаю работу">📢<br>Предлагаю работу</button><button data-type="Ищу работу">🔎<br>Ищу работу</button><button data-type="Бригада ищет работу">👷<br>Бригада ищет работу</button><button data-type="Ищу бригаду">🤝<br>Ищу бригаду</button></div><div id="formArea"></div><div id="formMessage"></div></section>

<section id="searchPanel" class="card hidden"><div class="section-title" id="searchTitle">🔎 Найти работу</div><div class="mode" id="searchMode"></div><div class="field"><label>📂 Категория</label><select id="sfCategory"><option value="">Любая категория</option></select></div><div class="field"><label>👷 Профессия / специальность</label><select id="sfProfession"><option value="">Любая профессия</option></select></div><div class="field"><label>📍 Город</label><select id="sfCity"><option value="">Любой город</option></select></div><button id="searchButton" class="button">🔎 Найти</button><div id="results"></div></section>

<section id="profilePanel" class="card hidden"><div class="section-title">👤 Мой профиль</div><div class="hint" style="margin:-6px 0 12px">Профиль — это вы, компания или бригада. Объявления находятся внутри профиля.</div><div id="myProfileContent" class="muted">Загрузка...</div></section><section id="editPanel" class="card hidden"><div class="actions"><button class="nav-btn" id="editBackBtn">← Назад</button></div><div class="section-title" id="editTitle">✏️ Редактирование</div><div id="editArea"></div><div id="editMessage"></div><button id="editProfileBottom" class="result-btn secondary" type="button" style="margin-top:12px">← Вернуться в мой профиль</button></section>
<section id="detailPanel" class="card hidden"><div class="actions"><button class="nav-btn" id="backBtn">← Назад</button></div><div id="detailContent"></div></section><div id="photoLightbox" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out"><button id="photoLightboxClose" type="button" aria-label="Закрыть" style="position:absolute;top:14px;right:14px;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:50%;width:42px;height:42px;font-size:26px;z-index:2;cursor:pointer">×</button><img id="lightboxImage" style="max-width:92vw;max-height:92vh;object-fit:contain;border-radius:14px"></div>
</main>
<script>
const API='https://script.google.com/macros/s/AKfycbwGiif2P_hjtiv5jY-CrBn__6LcFw7544x6p4-ioP0LCXlPsE0KBY5cvMICmSGA9nzl/exec';
const tg=window.Telegram&&Telegram.WebApp?Telegram.WebApp:null;if(tg){tg.ready();tg.expand();}
const categories=['Транспорт','Строительство','Производство','Склад и логистика','Уборка и клининг','Рестораны и гостиницы','Авто','Торговля и продажи','Офис и IT','Уход и помощь','Сельское хозяйство','Ремонт и обслуживание','Сфера услуг','Разнорабочие','Бьюти и красота','Другое'];
const cities=['Прага','Брно','Острава','Пльзень','Либерец','Оломоуц','Ческе-Будеёвице','Градец-Кралове','Пардубице','Усти-над-Лабем','Злин','Карловы Вары','Яблонец-над-Нисоу','Млада-Болеслав','Теплице','Дечин','Хомутов','Кладно','Пршеров','Опава','Фридек-Мистек','Другой город','Вся Чехия'];
const languages=['Чешский','Русский','Украинский','Английский','Немецкий','Итальянский','Испанский','Польский','Словацкий','Французский','Другой'];
const docs=['Виза','Zaměstnanecká karta','Živnost / IČO','EU паспорт','Не имеет значения'];
const docsCandidate=['Виза','Zaměstnanecká karta','Živnost / IČO','EU паспорт'];
const licenseCategories=['Нет','AM','A1','A2','A','B','BE','C','C1','C1E','CE','D','D1','D1E','DE','T'];
const schedules=['Пн–Пт','Пн–Сб','2/2','3/3','4/4','Дневные смены','Ночные смены','Гибкий график'];
const professionMap={
'Транспорт':['Водитель B','Водитель C','Водитель C+E','Водитель D','Водитель автобуса','Водитель микроавтобуса','Курьер','Таксист','Экспедитор','Диспетчер','Водитель погрузчика (VZV)','Водитель погрузчика','Тракторист','Водитель комбайна','Водитель тяжёлой техники','Оператор спецтехники','Другой специалист'],
'Строительство':['Каменщик','Бетонщик','Арматурщик','Монтажник','Плиточник','Штукатур','Маляр','Кровельщик','Фасадчик','Сантехник','Электрик','Сварщик','Столяр','Плотник','Гипсокартонщик','Прораб','Разнорабочий','Другой специалист'],
'Производство':['Оператор CNC','Оператор станка','Оператор линии','Сборщик','Комплектовщик','Упаковщик','Пикер','Контролёр качества','Рабочий производства','Технолог','Другой специалист'],
'Склад и логистика':['Кладовщик','Комплектовщик','Пикер','Упаковщик','Водитель погрузчика','Приёмщик товара','Экспедитор','Логист','Диспетчер','Другой специалист'],
'Уборка и клининг':['Уборщик','Уборщица','Горничная','Клинер','Мойщик окон','Уборка после ремонта','Уборка офисов','Уборка квартир','Другой специалист'],
'Рестораны и гостиницы':['Повар','Су-шеф','Шеф-повар','Помощник повара','Кондитер','Пекарь','Официант','Бармен','Бариста','Посудомойщик','Горничная','Администратор','Другой специалист'],
'Авто':['Автомеханик','Автоэлектрик','Автослесарь','Шиномонтажник','Кузовщик','Маляр по автомобилям','Диагност','Мастер по кондиционерам','Детейлер','Мойщик автомобилей','Другой специалист'],
'Торговля и продажи':['Продавец','Кассир','Продавец-консультант','Менеджер по продажам','Торговый представитель','Мерчендайзер','Администратор магазина','Директор магазина','Другой специалист'],
'Офис и IT':['Администратор','Менеджер','Офис-менеджер','Бухгалтер','HR / рекрутер','Менеджер по продажам','Оператор','Программист','Веб-разработчик','Дизайнер','SMM-специалист','Другой специалист'],
'Уход и помощь':['Сиделка','Няня','Помощник по дому','Санитар','Медсестра','Другой специалист'],'Сельское хозяйство':['Рабочий фермы','Садовник','Сборщик урожая','Тракторист','Животновод','Другой специалист'],'Ремонт и обслуживание':['Мастер по ремонту','Слесарь','Электрик','Сантехник','Техник','Другой специалист'],'Сфера услуг':['Мастер','Администратор','Оператор','Курьер','Другой специалист'],'Разнорабочие':['Разнорабочий','Помощник на производстве','Помощник на стройке','Другой специалист'],'Бьюти и красота':['Парикмахер','Барбер','Мастер маникюра','Мастер педикюра','Визажист','Косметолог','Массажист','Другой специалист'],'Другое':['Другой специалист']};
function opts(arr,first){return (first?'<option value="">'+first+'</option>':'')+arr.map(x=>'<option>'+esc(x)+'</option>').join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function field(label,id,html,req=false){return '<div class="field"><label for="'+id+'">'+label+(req?' <span class="required">*</span>':'')+'</label>'+html+'</div>'}
function multiBlock(label,name,items){return '<div class="field"><label>'+label+'</label><details class="multi"><summary id="sum_'+name+'">Выберите</summary><div class="checkgrid">'+items.map(x=>'<label class="check"><input type="checkbox" name="'+name+'" value="'+esc(x)+'"> '+esc(x)+'</label>').join('')+'</div></details></div>'}
function select(id,a,first,req=false){return field('',id,'<select id="'+id+'">'+opts(a,first)+'</select>',req)}
function input(id,placeholder,req=false,type='text'){return '<div class="field"><label for="'+id+'">'+placeholder+(req?' <span class="required">*</span>':'')+'</label><input id="'+id+'" type="'+type+'" placeholder="'+esc(placeholder)+'"></div>'}
function textarea(id,label,placeholder,req=false){return '<div class="field"><label for="'+id+'">'+label+(req?' <span class="required">*</span>':'')+'</label><textarea id="'+id+'" placeholder="'+esc(placeholder)+'"></textarea></div>'}
function catSelect(){return field('📂 Категория','category','<select id="category">'+opts(categories,'Выберите категорию')+'</select>',true)}
function profBlock(label='👷 Профессия',req=true){return '<div class="field"><label>'+label+(req?' <span class="required">*</span>':'')+'</label><details class="multi"><summary id="sum_profession">Выберите профессию</summary><div id="professionChecks" class="checkgrid"><div class="hint">Сначала выберите категорию</div></div></details><input id="customProfession" class="hidden" style="margin-top:8px" placeholder="Введите свою профессию / специальность"></div>'}
function salaryBlock(label){return '<div class="card" style="padding:12px"><div class="field"><label>💰 '+label+'</label><div class="row"><input id="salaryFrom" inputmode="numeric" placeholder="От"><input id="salaryTo" inputmode="numeric" placeholder="До"></div></div><select id="salaryUnit">'+opts(['Kč/час','Kč/день','Kč/месяц','По договорённости'],'Выберите единицу оплаты')+'</select></div>'}
function languagesBlock(){return multiBlock('🗣 Языки','lang',languages)+'<div class="field"><label>Уровень языка</label><select id="languageLevel"><option value="">Не указывать</option>'+opts(['A1','A2','B1','B2','C1','C2','Родной'],'')+'</select></div>'}
function docsBlock(candidate){let a=candidate?docsCandidate:docs;return multiBlock('📄 Документы','doc',a)}
function commonWork(){return '<div class="row"><div class="field"><label>📅 Тип работы</label><select id="workType">'+opts(['Постоянная работа','Временная работа'],'Выберите')+'</select></div><div class="field"><label>💼 Занятость</label><select id="employmentType">'+opts(['Полная занятость','Неполная занятость','Посменно','Вахта','Фушка','По договорённости'],'Выберите')+'</select></div></div>'+field('🕐 График','schedule','<select id="schedule">'+opts(schedules,'Выберите')+'</select>')}
function housingForCandidate(){return field('🏠 Жильё','housing','<select id="housing">'+opts(['Требуется','Не требуется','Рассмотрю варианты с жильём'],'Выберите')+'</select>')}
function housingEmployer(){return field('🏠 Жильё','housing','<select id="housing">'+opts(['Предоставляется','Не предоставляется','За доплату','По договорённости','Не указано'],'Выберите')+'</select>')}
function filesBlock(){return '<div class="field"><label>📷 Фото <span class="hint">(необязательно)</span></label><input id="photoFile" class="file" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"><div class="hint" id="photoFileHint">Обычное фото с телефона. Система автоматически уменьшит размер без заметной потери качества.</div><img id="photoPreview" class="preview hidden"></div><div class="field"><label>📄 Резюме <span class="hint">(необязательно)</span></label><input id="resumeFile" class="file" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><div class="hint" id="resumeName"></div><div class="hint">PDF, DOC или DOCX · до 12 МБ. Большие PDF/DOCX в текущей системе безопасно сжимать автоматически нельзя.</div></div>'}
function contactBlock(){return input('contact','📞 Контакт',true)+ '<div class="hint">Телефон или @username Telegram</div>'}
function renderForm(type,targetId='formArea'){let html='';if(type==='Предлагаю работу'){html=input('title','📋 Название вакансии',true)+catSelect()+profBlock()+field('📍 Город','city','<select id="city">'+opts(cities,'Выберите город')+'</select>',true)+salaryBlock('Зарплата')+commonWork()+housingEmployer()+languagesBlock()+docsBlock(false)+field('🧰 Опыт','experienceRequired','<select id="experienceRequired">'+opts(['Требуется','Не требуется'],'Выберите')+'</select>')+field('🚗 Водительские права','drivingLicenses','<select id="drivingLicenses">'+opts(['Требуются','Не требуются'],'Выберите')+'</select>')+field('🚙 Автомобиль','automobile','<select id="automobile">'+opts(['Требуется','Не требуется','Предоставляется работодателем'],'Выберите')+'</select>')+textarea('qualification','🎓 Квалификация','Что должен уметь / иметь кандидат')+textarea('skills','🛠 Навыки','Какие навыки нужны')+field('🔞 Возраст','age18','<select id="age18"><option value="">Не указано</option><option value="true">18+</option></select>')+field('📅 Дата начала','readyDate','<div class="date-wrap"><input id="readyDate" type="date" lang="ru-RU"><button type="button" class="date-btn" id="readyDateBtn">📅</button></div>')+textarea('description','📝 Описание вакансии','Подробно опишите работу, условия и требования',true)+contactBlock();}

async function waitForEntity(submissionId,fallbackId,timeoutMs=90000){

async function openDetail(type,id){
  if(!window.lastDetailContext)window.lastDetailContext=(document.getElementById('searchPanel').classList.contains('hidden')?'profile':'search');
  document.getElementById('publishPanel').classList.add('hidden');document.getElementById('searchPanel').classList.add('hidden');document.getElementById('profilePanel').classList.add('hidden');document.getElementById('editPanel').classList.add('hidden');document.getElementById('detailPanel').classList.remove('hidden');

  let decodedId=decodeURIComponent(id);

    let cached=getCachedProfileFromBrowser(decodedId);
    if(cached){box.innerHTML=detailHtml(type,cached);return;}
  }
  let action=type==='candidate'?'getCandidateProfile':type==='vacancy'?'getVacancy':type==='brigade'?'getBrigade':'getBrigadeRequest';
  let key=type==='candidate'?'profileId':type==='vacancy'?'vacancyId':type==='brigade'?'brigadeId':'brigadeRequestId';
  try{
    let r=await apiPost({action,[key]:decodedId},type==='candidate'?20000:45000);

    let o=r.profile||r.vacancy||r.brigade||r.request;
    if(type==='candidate')cacheProfileInBrowser(decodedId,o);
    box.innerHTML=detailHtml(type,o);
